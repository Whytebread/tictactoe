<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Tic Tac Toe</title>
    <link rel='stylesheet' href='main.css'>
    <script src='main.js' defer></script>
</head>

<body>
    <h1>Tic Tac Toe</h1>
    <div class="board-container">
        <div class="board-square" data-index "0"></div>
        <div class="board-square" data-index "1"></div>
        <div class="board-square" data-index "2"></div>
        <div class="board-square" data-index "3"></div>
        <div class="board-square" data-index "4"></div>
        <div class="board-square" data-index "5"></div>
        <div class="board-square" data-index "6"></div>
        <div class="board-square" data-index "7"></div>
        <div class="board-square" data-index "8"></div>
    </div>

    <div class="players-container">
        <div class="player-one-container">
            <label for="player-one">Player One</label><br><br>
            <input type="text" name="player-one" id="player-one" required>
            <p class="player-symbol">X</p>
        </div>
        <div class="player-two-container">
            <label for="player-one">Player Two</label><br><br>
            <input type="text" name="player-two" id="player-two" required>
            <p class="player-symbol">O</p>
        </div>
    </div>

    <div class="player-turn">

    </div>
    
    <div class="winner-display">

    </div>

    <div class="buttons">
        <button class="new">Start New Game</button>
        <button class="reset">Reset</button>
    </div>

</body>

</html>
