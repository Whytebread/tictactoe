<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Tic Tac Toe</title>
    <link rel='stylesheet' href='main.css'>
    <lin rel='script' defer href="main.js"></lin>
</head>

<body>
    <h1>Tic Tac Toe</h1>
    <div class="board-container">
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
        <div class="board-square"></div>
    </div class="players-container">
    <div class="player-one-container">
        <label for="player-one">Player One</label>
        <input type="text" name="player-one" id="player-one" required>
        <p>X</p>
    </div>
    <div class="player-two-container">
        <label for="player-one">Player Two</label>
        <input type="text" name="player-two" id="player-two" required>
        <p>O</p>
    </div>
    </div>
    <div class="player-turn">

    </div>
    <div class="winner-display">

    </div>
    <div class="buttons">
        <button class="new">Start New Game</button>
        <button class="reset">Reset</button>
    </div>
</body>

</html>
